# Prometheus for the demo stack (docker compose --profile monitoring up).
# The API and the worker require METRICS_TOKEN as a bearer token; the token file is mounted from
# infra/monitoring/metrics-token (created by `npm run setup:env`, never committed).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['api:4000']
  - job_name: worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['worker:4001']
