name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: events
          POSTGRES_PASSWORD: ci-throwaway-password # ephemeral service container, not a real secret
          POSTGRES_DB: events_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U events -d events_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://events:ci-throwaway-password@localhost:5432/events_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images and Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose --profile app config --quiet
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway-password
          JWT_SECRET: ci-throwaway-jwt-secret-not-used-at-runtime-000000
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t events-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t events-web:ci .
